{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels:
    release: {{ .Values.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels: { app: api }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  labels:
    release: {{ .Values.serviceMonitor.releaseLabel }}
spec:
  groups:
    - name: devops-e2e.api
      rules:
        - alert: ApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{job="api"}[5m])), 1) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "API 5xx rate above 5% for 5 minutes"
        - alert: ApiHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "API p95 latency above 500ms"
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m]) > 3
          labels: { severity: warning }
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} restarting repeatedly"
{{- end }}
