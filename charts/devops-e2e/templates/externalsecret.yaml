{{- if .Values.externalSecret.enabled }}
# Requires External Secrets Operator + a ClusterSecretStore pointing at AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "e2e.dbSecretName" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: {{ include "e2e.dbSecretName" . }}
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
