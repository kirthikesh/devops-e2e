{{- if .Values.networkPolicy.enabled }}
# Default deny ingress, then allow only the paths the app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
spec:
  podSelector:
    matchLabels: { app: frontend }
  ingress:
    - ports: [{ port: {{ .Values.frontend.port }} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
spec:
  podSelector:
    matchLabels: { app: api }
  ingress:
    - ports: [{ port: {{ .Values.api.port }} }]   # frontend, ingress controller, Prometheus
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-api
spec:
  podSelector:
    matchLabels: { app: postgres }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
      ports: [{ port: 5432 }]
{{- end }}
{{- end }}
