name: CI

on:
  pull_request:
    paths: ["app/**", "charts/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", "charts/**", ".github/workflows/ci.yml"]

permissions:
  contents: write        # bump image tag in gitops/
  packages: write        # push to GHCR
  security-events: write # upload Trivy SARIF

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/devops-e2e

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: app/api }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/devops-e2e -f gitops/envs/dev/values.yaml
      - run: helm template charts/devops-e2e -f gitops/envs/prod/values.yaml > /dev/null

  sonarcloud:
    if: ${{ vars.SONAR_ENABLED == 'true' }}   # set repo variable + SONAR_TOKEN secret to enable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build:
    needs: [test, helm-lint]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy report (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Trivy gate (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag  $IMAGE_PREFIX-${{ matrix.service }}:${{ github.sha }} $IMAGE_PREFIX-${{ matrix.service }}:latest
          docker push $IMAGE_PREFIX-${{ matrix.service }}:${{ github.sha }}
          docker push $IMAGE_PREFIX-${{ matrix.service }}:latest

  # GitOps hand-off: CI never touches the cluster. It bumps the tag in git; ArgoCD deploys it.
  update-gitops:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    # One deploy commit at a time: a newer run replaces a queued older one
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Bump dev image tags and push (retry if main moved)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main
            yq -i '.api.image.tag = "${{ github.sha }}" | .frontend.image.tag = "${{ github.sha }}"' gitops/envs/dev/values.yaml
            git add gitops/envs/dev/values.yaml
            if git diff --cached --quiet; then echo "Tag already up to date"; exit 0; fi
            git commit --quiet -m "deploy(dev): ${{ github.sha }}"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected because main moved; retrying ($attempt/5)"
            git reset --hard --quiet origin/main
            sleep $((attempt * 3))
          done
          exit 1
