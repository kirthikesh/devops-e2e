name: Terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read
  id-token: write   # OIDC to AWS, no long-lived keys

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true   # report only while learning; set false to enforce

  plan:
    # Enable once the AWS OIDC role exists: set repo variable AWS_ROLE_ARN
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init
      - run: terraform plan -no-color -input=false
