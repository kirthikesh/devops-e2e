<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps E2E Todos</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { font-weight: 600; letter-spacing: -.02em; }
    form { display:flex; gap:8px; margin-bottom:24px; }
    input[type=text] { flex:1; padding:10px; background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; }
    button { padding:10px 14px; background:var(--fg); color:var(--bg); border:0; border-radius:6px; cursor:pointer; }
    li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); list-style:none; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li button { margin-left:auto; background:transparent; color:var(--muted); }
    ul { padding:0; }
    footer { color:var(--muted); font-size:12px; margin-top:24px; }
  </style>
</head>
<body>
<main>
  <h1>Todos · deployed by ArgoCD</h1>
  <form id="f"><input id="t" type="text" placeholder="What needs doing?" required /><button>Add</button></form>
  <ul id="list"></ul>
  <footer>API version: <span id="v">…</span></footer>
</main>
<script>
  const list = document.getElementById('list');
  async function load() {
    const todos = await (await fetch('/api/todos')).json();
    list.innerHTML = '';
    for (const t of todos) {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
      cb.onchange = () => fetch(`/api/todos/${t.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: t.title, done: cb.checked }) }).then(load);
      const span = Object.assign(document.createElement('span'), { textContent: t.title });
      const del = Object.assign(document.createElement('button'), { textContent: '✕' });
      del.onclick = () => fetch(`/api/todos/${t.id}`, { method: 'DELETE' }).then(load);
      li.append(cb, span, del);
      list.append(li);
    }
  }
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const t = document.getElementById('t');
    await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: t.value }) });
    t.value = ''; load();
  };
  fetch('/api/version').then(r => r.json()).then(d => document.getElementById('v').textContent = d.version);
  load();
</script>
</body>
</html>
