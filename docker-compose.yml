services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 5s
      retries: 10

  api:
    build: ./app/api
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todo
      APP_VERSION: local
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./app/frontend
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["8080:8080"]

volumes:
  pgdata:
