# Prod on EKS: Postgres on RDS (URL synced from AWS Secrets Manager by
# External Secrets via IRSA), autoscaling and disruption budgets on.
# Images come from GHCR (built + Trivy-scanned by CI). Promote a tested SHA
# from envs/dev to here via pull request.
api:
  image:
    tag: latest
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

frontend:
  image:
    tag: latest
  replicas: 2

postgres:
  enabled: false

externalSecret:
  enabled: true
  remoteKey: devops-e2e/database-url

ingress:
  host: todo.eks.local   # no DNS: test with curl -H "Host: todo.eks.local" http://<load-balancer>
  tls: false

serviceMonitor:
  enabled: true
