# Dev (local kind or EKS dev). CI updates the image tags below automatically.
api:
  image:
    tag: latest
  autoscaling:
    enabled: false
  replicas: 1

frontend:
  image:
    tag: latest
  replicas: 1

postgres:
  enabled: true

ingress:
  host: todo.localtest.me

serviceMonitor:
  enabled: true

podDisruptionBudget:
  enabled: false
