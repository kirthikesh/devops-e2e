# Prometheus + Grafana + Alertmanager (kube-prometheus-stack), plus our dashboards.
# Same app as gitops/argocd/apps/monitoring.yaml (local kind). Values: monitoring/kube-prometheus-stack-values.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.*
      helm:
        valueFiles:
          - $values/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/kirthikesh/devops-e2e.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/kirthikesh/devops-e2e.git
      targetRevision: main
      path: monitoring/dashboards   # Grafana dashboards as ConfigMaps
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # Prometheus CRDs are too large for client-side apply
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
# Loki (logs) is added later, once the metrics stack is stable on the laptop.
