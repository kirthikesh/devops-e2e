# App-of-apps: apply this once (kubectl apply -f gitops/argocd/root-app.yaml)
# and ArgoCD manages everything in gitops/argocd/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kirthikesh/devops-e2e.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
