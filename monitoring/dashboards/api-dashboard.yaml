# Grafana picks this up via the dashboard sidecar (label grafana_dashboard=1).
# Apply: kubectl apply -n monitoring -f monitoring/dashboards/api-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-e2e-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  devops-e2e-api.json: |
    {
      "title": "DevOps E2E – API (Golden Signals)",
      "uid": "devops-e2e-api",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "type": "timeseries", "title": "Requests / sec", "gridPos": {"x":0,"y":0,"w":12,"h":8},
          "targets": [{ "expr": "sum by (handler) (rate(http_requests_total{job=\"api\"}[1m]))" }] },
        { "type": "timeseries", "title": "5xx error ratio", "gridPos": {"x":12,"y":0,"w":12,"h":8},
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"api\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{job=\"api\"}[5m])),1)" }] },
        { "type": "timeseries", "title": "Latency p50 / p95", "gridPos": {"x":0,"y":8,"w":12,"h":8},
          "targets": [
            { "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api\"}[5m])))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api\"}[5m])))", "legendFormat": "p95" } ] },
        { "type": "timeseries", "title": "CPU by pod", "gridPos": {"x":12,"y":8,"w":12,"h":8},
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{container=\"api\"}[5m]))" }] }
      ]
    }
